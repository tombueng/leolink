# Snap package.
#
# Strict confinement, deliberately. leolink talks to cameras over the network,
# draws through OpenGL, plays and records sound, and writes recordings into the
# user's own folders — every one of which strict confinement covers through a
# named interface. Asking for classic would mean a manual review by Canonical
# and weeks of waiting, in exchange for permissions the program does not need.
#
# The one thing that does not survive confinement is the "password command"
# option, which runs `pass` or `secret-tool` on the host. A confined snap cannot
# see those. The password field works as normal; that shortcut does not.
#
# Qt is staged into the snap rather than taken from the kde-neon-6 extension.
# The extension would be smaller and would pick up Qt fixes without a rebuild
# here, but it clones canonical/gpu-snap from GitHub while building, and the
# LXD build container on this machine reaches the Ubuntu archive and nothing
# else. Measured: apt works, `git ls-remote github.com` does not. Bundling Qt
# costs size and needs a rebuild for Qt updates; it does build.
#
# Build:   sg lxd -c "snapcraft --use-lxd"
# Install: sudo snap install --dangerous ./leolink_*.snap
name: leolink
base: core24
adopt-info: leolink
summary: Watch and record Reolink cameras
description: |
  A native Linux client for Reolink IP cameras. Several cameras at once in a
  grid you arrange yourself, with the volume of each under its own control.

  Motion can come from the camera itself over ONVIF, or be worked out here from
  the picture for cameras that report nothing — with drawable zones, so a tree
  in the wind or a neighbour's door can be left out. Recordings are written to
  your own disk, which works even on cameras with no memory card fitted.

  It also changes the settings on the camera: resolution, frame rate, bit rate,
  the detection area, privacy zones the camera blanks before anything leaves it,
  users and Wi-Fi. Every control is built from what the camera itself reports it
  can do, so a model is never offered a setting it does not have.

  Nothing is sent to any third party. On the local network leolink talks only to
  the camera.

title: leolink
website: https://github.com/tombueng/leolink
source-code: https://github.com/tombueng/leolink
issues: https://github.com/tombueng/leolink/issues
contact: https://github.com/tombueng/leolink/issues
icon: resources/icons/leolink.svg

license: MIT
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

apps:
  leolink:
    command: usr/bin/leolink
    desktop: usr/share/applications/io.github.tombueng.leolink.desktop
    plugs:
      # The desktop ones have to be listed by hand here. With the kde-neon-6
      # extension they come for free, and leaving them out produced a snap that
      # started, loaded its Qt plugins and then died with "could not connect to
      # display" — which reads like a broken build and is in fact a missing
      # permission.
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7           # the tray icon
      - network          # the cameras
      - network-bind     # the loopback port Baichuan video is re-served on
      - opengl
      - audio-playback   # camera microphones, and the alert sound
      - audio-record     # talking back through a camera's speaker
      - home             # recordings and snapshots
      - removable-media  # a recordings folder on an external disk
      - password-manager-service
    environment:
      # ffmpeg is bundled and run as a program: recording, and the detection
      # leolink does itself.
      PATH: $SNAP/usr/bin:$PATH
      # Several libraries here keep their real code in a subdirectory of their
      # own and list it as a NEEDED — libproxy's backend and PulseAudio's
      # common library both do. They are inside the snap; they are simply off
      # the default path, and the binary then will not start at all with
      # "cannot open shared object file". The rest of the subdirectories
      # (dri, gbm, vdpau) are loaded by name at run time and are covered by the
      # variables the graphics stack uses.
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$SNAP/usr/lib:$LD_LIBRARY_PATH
      QT_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins/platforms
      FONTCONFIG_PATH: $SNAP/etc/fonts

parts:
  leolink:
    plugin: cmake
    # From the working tree: the build container has no route to GitHub, and
    # for a local build a checkout would be redundant anyway.
    source: .
    source-type: local
    override-pull: |
      craftctl default
      # The project's own version, not cmake_minimum_required's — a loose grep
      # for "VERSION" finds that first and labelled the snap 3.21.
      craftctl set version="$(sed -n 's/^[[:space:]]*VERSION \([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)"
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - qt6-base-dev
      - qt6-base-dev-tools
      - qt6-svg-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - libmpv-dev
      - libgl-dev
    stage-packages:
      # Qt, since there is no extension to provide it — see the note at the top.
      - libqt6widgets6
      - libqt6gui6
      - libqt6core6
      - libqt6dbus6
      - libqt6network6
      - libqt6xml6
      - libqt6svg6
      - libqt6opengl6
      - libqt6openglwidgets6
      - qt6-qpa-plugins
      - qt6-wayland
      - libgl1
      - libglx-mesa0
      - libegl1
      - fontconfig
      - fonts-dejavu-core
      # Qt Network loads libproxy at start-up, and its backend lives in a
      # separate package that nothing links against directly — so it is not
      # pulled in automatically, and the binary refuses to start with
      # "libpxbackend-1.0.so: cannot open shared object file".
      - libproxy1v5
      # libmpv does the decoding, the hardware acceleration and the audio.
      - libmpv2
      # Recording and both detectors run ffmpeg as a separate process. Without
      # it those features report themselves unavailable rather than failing
      # obscurely, but a camera viewer that cannot record is only half of one.
      - ffmpeg
    prime:
      - -usr/share/doc
      - -usr/share/man
