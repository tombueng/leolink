name: Release

# Everything a release needs is built here rather than on somebody's machine:
# the artefacts people download should come from a known source tree with a
# recorded log, not from whichever laptop happened to be to hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build a release for"
        required: true

permissions:
  contents: write

jobs:
  packages:
    name: deb, rpm and source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libmpv-dev qtkeychain-qt6-dev rpm desktop-file-utils appstream

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      # A store submission that fails on malformed metadata wastes a review
      # round trip. This is the same check the everyday build runs.
      - name: Validate desktop entry and AppStream data
        run: cmake --build build --target validate-metadata

      # The tag is pushed by now, so the tarball the AUR will download exists
      # and its checksum can be compared with the one the PKGBUILD promises.
      # Advisory here and only here: the checksum of a tarball GitHub has not
      # generated yet cannot be in the PKGBUILD before the tag that creates it,
      # so this is where the right value is printed rather than demanded. The
      # build on main insists on it afterwards.
      - name: Check the Arch packaging matches the tag
        continue-on-error: true
        run: python3 tools/check_arch_package.py --download

      - name: Package
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      # This runner is the reason the dependencies are written by hand: its Qt
      # packages still carry the time_t transition's t64 suffix, and a .deb that
      # asks for those cannot be configured on Ubuntu 25.10 or later. The check
      # is that nothing the binary loads has been left out of the list.
      - name: Check the .deb asks for what it loads
        run: python3 tools/check_deb_depends.py build/leolink-*-Linux.deb build/leolink

      - uses: actions/upload-artifact@v4
        with:
          name: native-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

  appimage:
    name: AppImage
    # The AppImage brings its own glibc, so the base it is built on sets no
    # floor for where it runs: packaging/appimage/build.sh says why.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        # Beyond what leolink needs to build: whatever the AppImage must carry
        # for it to run elsewhere (VA-API drivers, PipeWire's modules and
        # configuration, ALSA plugins, Qt's Wayland plugin), since quick-sharun
        # bundles only what is installed; and quick-sharun's own tools.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools libmpv-dev \
            qtkeychain-qt6-dev qt6-wayland \
            mesa-va-drivers intel-media-va-driver i965-va-driver \
            libpipewire-0.3-modules libspa-0.2-modules libpipewire-0.3-common \
            pipewire-alsa libasound2-plugins libpulse0 \
            wget file patchelf strace xvfb xauth librsvg2-bin

      - name: Build and install
        # Installed into /usr as a package would be: quick-sharun works from
        # an installed program, and runs it to see what it loads.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          sudo cmake --install build

      - name: Package
        run: packaging/appimage/build.sh

      # Named, not globbed: the packaging tools are AppImages too, and a glob
      # once shipped them as if they were part of leolink.
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: leolink*.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: [packages, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name 'leolink*.deb' -o -name 'leolink*.rpm' \
               -o -name 'leolink*.tar.gz' -o -name 'leolink*.AppImage' \) \
            -exec cp {} release/ \;
          # Checksums so anyone can tell that what they downloaded is what was
          # built. Generated here, from the artefacts themselves.
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
          body: |
            A native Linux client for Reolink cameras.

            ## Installing

            **Debian, Ubuntu, Mint**
            ```bash
            sudo apt install ./leolink-*-Linux.deb
            ```

            **Fedora, openSUSE**
            ```bash
            sudo dnf install ./leolink-*.rpm
            ```

            **Anywhere else**
            ```bash
            chmod +x leolink-*.AppImage
            ./leolink-*.AppImage
            ```

            `ffmpeg` is needed for recording and for the detection leolink does
            itself; everything else works without it.

            ## Verifying the download

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            ## Where it has been tested

            Against a Reolink RLC-410W and a Duo 2 PoE. Other models speak the
            same protocols and leolink asks each camera what it supports rather
            than assuming — but that is reasoning, not testing. Playback from an
            SD card, the P2P path and mobile data are implemented from the
            protocol and have never run against hardware that has them.
