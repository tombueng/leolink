name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libmpv-dev qtkeychain-qt6-dev \
            desktop-file-utils appstream

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # Malformed metadata is rejected by software centres at submission time.
      # Catching it here is far cheaper than finding out from Flathub.
      - name: Validate desktop entry and AppStream data
        run: cmake --build build --target validate-metadata

      # The AUR reads .SRCINFO rather than the PKGBUILD, and nothing regenerates
      # it. By 0.2.0 it still described 0.1.1, and the checksum beside it was
      # 0.1.1's too, so every AUR build failed verification, and it took somebody
      # building the package to find out. This is the nag: after a release, main
      # does not go green again until the PKGBUILD carries the new tag's
      # checksum. Before the tag exists there is nothing to download and nothing
      # to fail on.
      - name: Check the Arch packaging matches
        run: python3 tools/check_arch_package.py --download

      - name: Check translations are current
        run: |
          cmake --build build --target update_translations
          if ! git diff --quiet translations/; then
            echo "::warning::Translation files are out of date."
            echo "Run: cmake --build build --target update_translations"
            echo "then: python3 tools/fill_german.py"
            git diff --stat translations/
          fi

      - name: Build .deb and .rpm
        run: |
          sudo apt-get install -y rpm
          cd build && cpack

      # The Debian dependencies are written by hand, because shlibdeps names
      # each library after the package that ships it *here* — and this runner's
      # Qt still carries the time_t transition's t64 suffix that current Ubuntu
      # has dropped. This is what keeps the hand-written list complete.
      - name: Check the .deb asks for what it loads
        run: python3 tools/check_deb_depends.py build/leolink-*-Linux.deb build/leolink

      - uses: actions/upload-artifact@v4
        with:
          name: leolink-packages
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools libmpv-dev \
            qtkeychain-qt6-dev libfuse2t64 wget file librsvg2-bin

      - name: Build and stage
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=$PWD/AppDir cmake --install build

      # linuxdeploy pulls in Qt and libmpv so the result runs on any
      # reasonably current distribution without installing anything.
      - name: Package
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=/usr/lib/qt6/bin/qmake6
          # The AppImage catalog wants a PNG icon it can use as a thumbnail.
          # linuxdeploy prefers an SVG for the AppDir root whenever there is
          # one, so the SVG gives way to a rendered PNG. The window icon is
          # unaffected: it is compiled into the binary.
          icons=AppDir/usr/share/icons/hicolor
          mkdir -p $icons/256x256/apps
          rsvg-convert -w 256 -h 256 resources/icons/leolink.svg \
            -o $icons/256x256/apps/io.github.tombueng.leolink.png
          rm $icons/scalable/apps/io.github.tombueng.leolink.svg
          # libpipewire and libjack have to match the host's sound server, so
          # linuxdeploy never bundles them; without them libmpv, and with it
          # leolink, cannot start at all. A copy of each rides along for hosts
          # that lack one, and packaging/appimage/AppRun decides at start-up.
          fallback=AppDir/usr/lib/fallback
          mkdir -p $fallback/pipewire $fallback/jack
          for lib in pipewire:libpipewire-0.3.so.0 jack:libjack.so.0; do
            cp -L "$(ldconfig -p | awk -v l="${lib#*:}" '$1 == l { print $NF; exit }')" \
              $fallback/${lib%%:*}/${lib#*:}
          done
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --custom-apprun packaging/appimage/AppRun \
            --deploy-deps-only $fallback/pipewire --deploy-deps-only $fallback/jack \
            --desktop-file AppDir/usr/share/applications/io.github.tombueng.leolink.desktop \
            --icon-file $icons/256x256/apps/io.github.tombueng.leolink.png

      - uses: actions/upload-artifact@v4
        with:
          name: leolink-appimage
          path: '*.AppImage'
          if-no-files-found: error

  flatpak:
    name: Flatpak manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Full flatpak-builder runs take ~20 minutes because they build Qt from
      # the SDK. The manifest is linted on every push; the actual bundle is
      # built on release only.
      - name: Lint manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          python3 - <<'EOF'
          import sys, json
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          with open("packaging/flatpak/io.github.tombueng.leolink.yml") as f:
              manifest = yaml.safe_load(f)
          required = ["app-id", "runtime", "runtime-version", "sdk", "command", "modules"]
          missing = [k for k in required if k not in manifest]
          if missing:
              sys.exit(f"manifest is missing: {', '.join(missing)}")
          print(f"manifest ok: {manifest['app-id']}")
          EOF
